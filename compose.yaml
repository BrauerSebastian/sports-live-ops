services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_live_ops
      POSTGRES_USER: sports_live_ops
      POSTGRES_PASSWORD: sports_live_ops
    ports:
      - "5432:5432"
    volumes:
      - sports_live_ops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_live_ops -d sports_live_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sports_live_ops_postgres:
